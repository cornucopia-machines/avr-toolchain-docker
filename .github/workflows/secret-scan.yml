name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  secret-scan:
    # Shared across the org's repos; see https://github.com/cornucopia-machines/.github.
    uses: cornucopia-machines/.github/.github/workflows/secret-scan.yml@main
